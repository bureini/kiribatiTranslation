name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up Java JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 3: Setup clean Gradle instance
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1
        validate-wrappers: false

    # Step 4: Create the .env file
    - name: Create .env File
      run: |
        echo "GEMINI_API_KEY=YOUR_DUMMY_KEY" > .env

    # Step 5: FIX - Build the Debug APK while bypassing the missing keystore error
    - name: Build with Gradle
      run: gradle assembleDebug -Pandroid.injected.signing.config.file=""

    # Step 6: Upload the generated APK as a downloadable artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiribati-translation-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk