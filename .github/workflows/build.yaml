name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for this release (e.g. v1.0.3)'
        required: true
        default: 'v0.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Fix for corrupt gradle-wrapper.jar: Install Gradle CLI temporarily & regenerate wrapper
    - name: Fix and Regenerate Gradle Wrapper Binary
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper --gradle-version 8.8 --distribution-type bin

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Create .env File
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

    - name: Generate Dummy Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Print environment & Gradle info
      run: |
        echo "=== Java ==="
        java -version || true
        echo "=== Gradle (wrapper if present) ==="
        ./gradlew -v || gradle -v || true
        echo "=== Project properties (app) ==="
        ./gradlew -q :app:properties | sed -n '1,120p' || true
        echo "=== Version catalog ==="
        cat gradle/libs.versions.toml || true

    - name: Build Debug APK with Regenerated Wrapper (verbose)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: Locate Generated APK
      run: |
        echo "=== Output Files ==="
        ls -la app/build/outputs/apk/debug/ || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiribati-translation-debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Create Public Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/*.apk
        name: E-Kainano Translation Release ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        body: |
          Official release build for E-Kainano Kiribati Translation app.

          * Bidirectional Kiribati/English Gemini AI translation engine
          * Local Room Database synchronization & ledger tracking
          * Jetpack Compose Material 3 UI
        draft: false
        prerelease: false
