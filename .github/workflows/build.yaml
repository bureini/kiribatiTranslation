name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up Java JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 3: Setup clean Gradle instance
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1
        validate-wrappers: false

    # Step 4: Create the .env file
    - name: Create .env File
      run: |
        echo "GEMINI_API_KEY=YOUR_DUMMY_KEY" > .env

    # Step 5: FIX - Generate a temporary dummy debug keystore file to satisfy debugConfig
    - name: Generate Dummy Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # Step 6: Build the Debug APK using the fresh Gradle setup
    - name: Build with Gradle
      run: gradle assembleDebug