name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Triggers the release process when you push a tag like v1.0.0
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write # Required to allow the workflow to create a public release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up Java JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 3: Setup clean Gradle instance
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1
        validate-wrappers: false

    # Step 4: Create the .env file dynamically using the GitHub Secret
    - name: Create .env File
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

    # Step 5: Generate a temporary dummy debug keystore file to satisfy debugConfig
    - name: Generate Dummy Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # Step 6: Build the Debug APK
    - name: Build with Gradle
      run: gradle assembleDebug --no-configuration-cache --refresh-dependencies

    # Step 7: Upload the generated APK as a pipeline artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiribati-translation-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    # Step 8: Automatically generate a Public GitHub Release (Only runs on version tags)
    - name: Create Public Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        name: Kiribati Translation Release ${{ github.ref_name }}
        tag_name: ${{ github.ref }}
        body: |
          First test version version release for testing.
          
          **Changes in this build:**
          * Compiled with target Gradle 9.3.1 configuration.
          * Built-in dynamic keystore profiling.
          * Production API key optimization embedded.
        draft: false
        prerelease: true # Marks it explicitly as a preview/testing build for your testers