name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up Java JDK 17 (Required for modern Gradle/Kotlin builds)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Step 3: Grant execute permission for the Gradle wrapper script
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # Step 4: Create a dummy .env file if required by your build template
    # Note: If your app requires a real API key to compile, swap 'YOUR_DUMMY_KEY' 
    # with a GitHub Secret variable like ${{ secrets.GEMINI_API_KEY }}
    - name: Create .env File
      run: |
        echo "GEMINI_API_KEY=YOUR_DUMMY_KEY" > .env

    # Step 5: Build the Debug APK using Gradle
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # Step 6: Upload the generated APK as a downloadable artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiribati-translation-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk