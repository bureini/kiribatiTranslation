name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Triggers the release process when you push a tag like v1.0.0
  pull_request:
    branches: [ "main" ]

# Explicitly grant permission to create releases in a public repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository source code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up Java JDK 17 (Required for modern Gradle/Kotlin compilers)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 3: Setup clean Gradle 9.3.1 instance and bypass the corrupt wrapper file
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1
        validate-wrappers: false

    # Step 4: Inject the GEMINI_API_KEY from your secure GitHub Secrets vault
    - name: Create .env File
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

    # Step 5: Dynamically generate a debug keystore file to satisfy the compiler's signingConfig
    - name: Generate Dummy Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # Step 6: Compile the APK bypassing configuration caches to ensure clean version parsing
    run: gradle clean assembleDebug --no-configuration-cache --refresh-dependencies
    
    # Step 7: Upload the finished binary package as an internal pipeline artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiribati-translation-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    # Step 8: Automatically generate an official Public GitHub Release (Only runs on version tags)
    - name: Create Public Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        name: Kiribati Translation Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        body: |
          First test version release for testers.
          
          **Changes in this build:**
          * Automated compilation with Gradle 9.3.1 configuration.
          * Secure production API key optimization embedded.
          * Dynamic workspace keystore execution.
        draft: false
        prerelease: true # Marks it explicitly as a preview/testing build for your testers
