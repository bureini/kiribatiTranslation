name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Triggers when pushing version tags like v1.0.3, v1.0.4, etc.
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out repository source code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up Java JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 3: Setup Gradle 9.3.1
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1
        validate-wrappers: false

    # Step 4: Inject GEMINI_API_KEY secret
    - name: Create .env File
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

    # Step 5: Generate Debug Keystore
    - name: Generate Dummy Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # Step 6: Assemble Debug APK
    - name: Build with Gradle
      run: gradle assembleDebug --no-configuration-cache --refresh-dependencies

    # Step 7: Verify generated APK exists in workspace before uploading
    - name: Locate Generated APK
      run: |
        echo "=== Listing APK Output Directory ==="
        ls -la app/build/outputs/apk/debug/ || ls -la build/outputs/apk/debug/ || true

    # Step 8: Upload APK Artifact to Action Run Summary
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiribati-translation-debug-apk
        path: app/build/outputs/apk/debug/*.apk

    # Step 9: Publish GitHub Release with APK attached (Only on tag pushes)
    - name: Create Public Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/*.apk
        name: E-Kainano Translation Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        body: |
          Official release build for E-Kainano Kiribati Translation app.
          
          **Included Features & Enhancements:**
          * Full Jetpack Compose UDF UI with dark mode support.
          * Offline Room Database persistence & syncing engine.
          * Gemini AI bidirectional Kiribati/English translation.
          * Human contributor verification and particle isolation.
        draft: false
        prerelease: false
