name: Build Web App and Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 1. Build the Android APK
    - name: Build Android APK
      run: ./gradlew :app:assembleRelease # Adjust ':app' if your Android module has a different name

    # 2. Build the Web App (Compose Multiplatform Wasm/JS)
    - name: Build Web App
      run: ./gradlew :app:wasmJsBrowserDistribution # or :app:jsBrowserDistribution depending on your configuration

    # 3. Upload the generated APK as an artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-release-apk
        path: app/build/outputs/apk/release/*.apk

    # 4. Upload the Web Build files as an artifact
    - name: Upload Web Artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-app-distribution
        path: app/build/dist/wasmJs/productionExecutable/ # Adjust path if using regular JS instead of Wasm
